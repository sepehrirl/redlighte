<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>2048 — Redlighte Game</title><link rel="stylesheet" href="/game/game.css?v=20260901-6"><link rel="stylesheet" href="/game/2048.css?v=20260901-2"><link rel="stylesheet" href="/game/game-mobile-fix.css?v=20260901-1"><link rel="stylesheet" href="/ecosystem-font.css?v=20261119-1"></head><body class="standalone-game" data-game-run="2048"><main class="standalone-shell"><div class="standalone-top"><button type="button" data-back-game>← Redlighte Game</button><span data-account-name>Redlighte Account</span></div><div id="gameModal"><div id="gameMount"></div></div></main><div class="toast" id="runtimeToast"></div><script>window.RedlighteGame={finish:async(game,score)=>{const runToken=new URLSearchParams(location.search).get('run');if(game!=='2048'||!runToken)return false;try{const r=await fetch('/api/game/run/finish',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({runToken,score})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Could not save run');const challenge=new URLSearchParams(location.search).get('challenge');if(challenge)await fetch('/api/game/challenges/score',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({id:challenge,runToken})});return true}catch(error){const t=document.getElementById('runtimeToast');if(t){t.textContent=error.message;t.classList.add('show')}return false}}};document.querySelector('[data-back-game]').onclick=()=>location.href='/game/';</script><script src="/game/auth-gate.js?v=ng1-1" defer></script><script src="/game/2048.js?v=ng1-3" defer></script><script>window.addEventListener('load',()=>window.Redlighte2048?.start());</script></body></html>
