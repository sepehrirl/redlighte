<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>Memory — Redlighte Game</title><link rel="stylesheet" href="/ecosystem-font.css?v=20261119-1"><style>body{margin:0;background:#08090b;color:#f7f7f8;font-family:Inter,system-ui,sans-serif}.standalone-shell{width:min(720px,100%);margin:auto;padding:18px;box-sizing:border-box}.standalone-game{border:1px solid #ffffff14;border-radius:26px;background:linear-gradient(145deg,#191a1f,#0c0d10);padding:clamp(18px,4vw,30px);box-shadow:0 24px 80px #0008}.standalone-game header{display:flex;justify-content:space-between;align-items:center;color:#ff6677;font-size:10px;font-weight:800}.standalone-game header a{color:#fff;text-decoration:none}.game-title{margin:30px 0 20px}.game-title small{color:#ff6677;font-weight:900;letter-spacing:.15em}.game-title h1{font-size:clamp(28px,6vw,42px);margin:7px 0}.game-title p,.footnote{color:#92949d;font-size:12px;line-height:1.6}.scoreline{display:flex;gap:12px}.scoreline div{flex:1;background:#ffffff09;border:1px solid #ffffff12;border-radius:15px;padding:12px}.scoreline small{display:block;color:#888b94;font-size:9px}.scoreline b{font-size:23px}.status{text-align:center;color:#ff8490;font-size:12px;padding:16px}.arena{position:relative;min-height:290px;border:1px solid #ffffff12;border-radius:20px;background:radial-gradient(circle at center,#241016,#0c0d10 72%);overflow:hidden;padding:12px;box-sizing:border-box}.target,.orbit-target{position:absolute;width:48px;height:48px;border:0;border-radius:50%;background:#ff3045;color:#fff;font-size:20px;box-shadow:0 0 25px #ff304566;cursor:pointer}.signal{width:100%;height:100px;border:0;border-radius:18px;background:#ffffff0b;color:#fff;font-weight:900;font-size:22px;cursor:pointer}.signal.red{background:#ff3045;box-shadow:0 0 35px #ff304566}.tile{width:100%;aspect-ratio:1;border:1px solid #ffffff17;border-radius:13px;background:#ffffff0a;color:#fff;cursor:pointer}.arena:has(.tile){display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.memory-grid,.break-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;height:100%}.memory-grid{grid-template-columns:repeat(2,1fr)}.memory-pad,.break-tile{min-height:70px;border:0;border-radius:14px;background:var(--pad,#ffffff15);color:#fff;font-weight:900;cursor:pointer}.memory-pad.lit{filter:brightness(1.8);box-shadow:0 0 24px var(--pad)}.break-tile{background:linear-gradient(145deg,#ff3045,#741321);min-height:44px}.break-tile.broken{opacity:.15;transform:scale(.8)}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1;min-height:46px;border:0;border-radius:13px;font-weight:900;cursor:pointer}.primary{background:#ff3045;color:#fff}.secondary{background:#ffffff12;color:#fff}.actions button:disabled{opacity:.4;cursor:not-allowed}.footnote{margin-bottom:0}@media(max-width:480px){.standalone-shell{padding:10px}.standalone-game{padding:16px}.arena{min-height:260px}}</style></head><body><main class="standalone-shell"><div id="gameMount"></div></main><script src="/game/game-registry.js" defer></script><script src="/game/game-sdk.js" defer></script><script src="/game/standalone.js" defer></script></body></html>
